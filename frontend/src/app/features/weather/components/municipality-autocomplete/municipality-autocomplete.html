<p-autocomplete
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [suggestions]="suggestions()"
  optionLabel="name"
  optionValue="name"
  [dropdown]="true"
  [showClear]="true"
  placeholder="Buscar municipio"
  (completeMethod)="onSearch($event)"
  (onSelect)="onSelect($event)"
  (onClear)="onClear()"
  (onInputKeydown)="onKeyDown($event)"
/>
