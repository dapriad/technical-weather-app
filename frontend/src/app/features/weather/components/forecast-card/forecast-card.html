<p-card>
  <div class="forecast-header">
    <h2>{{ municipalityName() }}</h2>
    <p>{{ dateLabel() }}</p>
  </div>

  <div class="temperature-row">
    <span class="temperature">{{ forecast().averageTemperature }}</span>
    <span class="unit">{{ unitLabel() }}</span>
  </div>

  <div class="precipitation-grid">
    @for (item of forecast().precipitationProbability; track item.period) {
      <div class="precipitation-item">
        <span class="probability">{{ item.probability }}%</span>
        <p-progressbar [value]="item.probability" [showValue]="false" />
        <span class="period">{{ item.period }}</span>
      </div>
    }
  </div>
</p-card>
