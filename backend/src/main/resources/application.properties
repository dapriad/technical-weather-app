spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

aemet.api.base-url=https://opendata.aemet.es/opendata
aemet.api.key=${AEMET_API_KEY:}

app.cache.municipalities-ttl=24h
app.cache.forecasts-ttl=30m
app.cache.forecasts-max-size=300

app.rate-limit.enabled=true
app.rate-limit.api-requests-per-minute=20
app.rate-limit.api-burst=5
app.rate-limit.global-requests-per-minute=60
app.rate-limit.global-burst=20
app.rate-limit.swagger-requests-per-minute=10
app.rate-limit.swagger-burst=3
app.rate-limit.global-swagger-requests-per-minute=20
app.rate-limit.global-swagger-burst=5
app.rate-limit.trust-forwarded-headers=true

app.aemet-budget.max-calls-per-day=300
app.aemet-budget.max-calls-per-minute=10
app.aemet-budget.max-calls-burst=5

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never